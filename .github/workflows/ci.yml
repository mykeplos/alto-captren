# Revisión automática: en cada PR revisa tipos y construye el sitio.
name: Revisión

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revisar:
    name: Revisar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Revisar tipos (astro check)
        run: npm run check
      - name: Construir sitio
        run: npm run build
