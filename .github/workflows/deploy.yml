# Publicación: al unir a main, construye y publica en GitHub Pages.
# URL de prueba: https://mykeplos.github.io/alto-captren/
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Calendario de disponibilidad (ver docs/calendario.md)
          PUBLIC_GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PUBLIC_CAL_CABANA_1: ${{ vars.CAL_CABANA_1 }}
          PUBLIC_CAL_CABANA_2: ${{ vars.CAL_CABANA_2 }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    name: Publicar en GitHub Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
